<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Top ribbon gradient -->
    <linearGradient id="topRibbon" x1="160" y1="130" x2="340" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD3F2"/>
      <stop offset="25%" stop-color="#F488D9"/>
      <stop offset="65%" stop-color="#BD56F3"/>
      <stop offset="100%" stop-color="#9B51E0"/>
    </linearGradient>

    <!-- Bottom ribbon gradient -->
    <linearGradient id="bottomRibbon" x1="160" y1="280" x2="350" y2="355" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7A1E5"/>
      <stop offset="40%" stop-color="#A855F7"/>
      <stop offset="85%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- Play triangle button gradient -->
    <linearGradient id="playGradient" x1="230" y1="210" x2="295" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F695E6"/>
      <stop offset="50%" stop-color="#C062F5"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- Inner dark cavity/depth -->
    <linearGradient id="innerCavity" x1="200" y1="190" x2="310" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F0829"/>
      <stop offset="100%" stop-color="#0E0514"/>
    </linearGradient>
  </defs>

  <!-- Inner Dark Negative Space Cavity -->
  <path d="M206,192 C236,182 284,188 308,212 C328,232 320,268 290,294 C260,320 216,306 206,290 C220,270 230,225 206,192 Z" fill="url(#innerCavity)"/>

  <!-- Upper Loop of 'S' -->
  <path d="M172,250 C160,205 174,152 220,138 C268,124 336,146 336,188 C336,220 286,230 252,204 C216,176 195,200 230,272 L172,250 Z" fill="url(#topRibbon)"/>

  <!-- Bottom Loop of 'S' -->
  <path d="M166,280 C162,298 185,348 244,360 C302,372 352,328 344,260 C340,240 316,242 306,260 C290,292 254,306 220,296 C190,286 172,274 166,280 Z" fill="url(#bottomRibbon)"/>

  <!-- Play Button Triangle (rounded corners) -->
  <path d="M242,216 L286,244 C294,249 294,259 286,264 L242,292 C234,297 225,291 225,282 L225,226 C225,217 234,211 242,216 Z" fill="url(#playGradient)"/>
</svg>
